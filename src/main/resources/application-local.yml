server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  docker:
    compose:
      enabled: true
      file: docker-compose.yml